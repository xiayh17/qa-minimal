# Deploy the static teaching frontend (web/) to GitHub Pages.
# Live-run API and model calls are not available on Pages; the site
# detects the missing backend and shows the static teaching build.
name: Deploy web to GitHub Pages

on:
  push:
    branches: [master]
    paths: ['web/**']
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
