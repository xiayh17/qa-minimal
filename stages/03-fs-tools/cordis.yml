# Stage 03 — Workspace FS: the first real Tool
#
# L3 = L2 + FS.  Every plugin from Stage 02 is still here — the agent can
# still resume across process restarts — plus the FS capability seam:
#
#   dsh-fs-local               Provider: implements ctx.fs (real filesystem)
#   dsh-fs-observation-policy  tracks which files the model has observed
#   dsh-tool-fs                Consumer: read / write / edit tool schemas
#
# Cordis dependency injection in one sentence:
#   Provider makes ctx.fs appear; Consumer declares a dependency on ctx.fs;
#   when the dependency is satisfied, Consumer activates and registers the
#   tool schemas onto ctx.tools — giving the model the ability to read and
#   write files.  Without the Provider, ctx.fs is absent and dsh-tool-fs
#   stays pending (it never finishes registering).  Without the Consumer,
#   ctx.fs works but the model has no tool to call it.
#
# dsh-tool-fs registers read / write / edit (and conditionally read_image),
# NOT a read-only subset.  This stage is a Workspace FS Agent — the model
# can produce real file side effects.  Search tools (glob / grep) are a
# separate plugin (dsh-tool-fs-search) that depends on ctx.subprocess;
# they arrive in Stage 04.

- name: '@deepseek-ai/dsh-llm'
- name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      local-anthropic:
        displayName: Local Gateway
        api: anthropic-messages
        baseURL: !!js process.env.QA_BASE_URL ?? 'https://your-gateway.example'
        apiKeyEnv: QA_API_KEY
        models:
          - id: deepseek-v4-pro
            contextWindow: 1000000
          - id: deepseek-v4-flash
            contextWindow: 1000000
# ── Agent spine (inherited from L1) ───────────────────────────────────────────
- name: '@deepseek-ai/dsh-session'
- name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: You are a helpful coding assistant. Read and write files when asked. Answer concisely.
- name: '@deepseek-ai/dsh-tools'
- name: '@deepseek-ai/dsh-agent'
- name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []
# ── persistence (inherited from L2) ───────────────────────────────────────────
- name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: ./sessions
- name: '@deepseek-ai/dsh-session-checkpoint-policy'
# ── FS capability seam (new in L3) ────────────────────────────────────────────
- name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.QA_WORKSPACE ?? process.cwd()
- name: '@deepseek-ai/dsh-fs-observation-policy'
- name: '@deepseek-ai/dsh-tool-fs'
- name: ./driver.mjs
