# Stage 04 — Coding Agent: real side effects
#
# Same as Stage 03, plus the Shell capability seam:
#   dsh-subprocess-local   Provider: child-process groups (spawn/kill/plumbing)
#   dsh-shell-env          publishes shell environment variables
#   dsh-bash-local         Provider: implements ctx.shell (runs real bash commands)
#   dsh-tool-bash          Consumer: bash tool schema on ctx.tools
#
# The Agent can now read files AND run commands — edit, test, git, anything.
# This is where "Q&A" becomes "coding agent": the model has real side effects.
- name: '@deepseek-ai/dsh-llm'
- name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      local-anthropic:
        displayName: Local Gateway
        api: anthropic-messages
        baseURL: !!js process.env.QA_BASE_URL ?? 'https://your-gateway.example'
        apiKeyEnv: QA_API_KEY
        models:
          - id: deepseek-v4-pro
            contextWindow: 1000000
          - id: deepseek-v4-flash
            contextWindow: 1000000
- name: '@deepseek-ai/dsh-session'
- name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: You are a coding agent. Read files with read_file, run commands with bash. Fix bugs when asked. Be concise.
- name: '@deepseek-ai/dsh-tools'
- name: '@deepseek-ai/dsh-agent'
- name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []
- name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.cwd()
- name: '@deepseek-ai/dsh-fs-observation-policy'
- name: '@deepseek-ai/dsh-tool-fs'
- name: '@deepseek-ai/dsh-subprocess-local'
- name: '@deepseek-ai/dsh-shell-env'
- name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.cwd()
    timeoutMs: 60000
- name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'
- name: ./driver.mjs