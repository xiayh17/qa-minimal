# Stage 08 — Multi-Agent
#
# L8 = L7 + Delegation.  Every plugin from Stage 06 is still here — sandbox,
# approval, FS, shell, search, persistence, resume — plus the two capability
# closures that grew in between:
#
#   L7 — Stateful Task Agent:
#     dsh-tool-todo        model-facing todo_write (whole-list replacement)
#     dsh-user-questions   user-questions seam (ctx.userQuestions) backing the
#                          exit_plan_mode review
#     dsh-plan-mode        logged plan/mode state + exit_plan_mode review
#     dsh-goal             event-sourced same-session goal domain (ctx.goals)
#     dsh-tool-goal        model-facing get/create/update_goal tools
#     dsh-storage          storage hub (ctx.storage) — backend registry
#     dsh-storage-sqlite   SQLite backend, registers as backend "sqlite"
#     dsh-storage-domain   domain data form, provides ctx.storageDomain
#     dsh-workspace        workspace entity registry (ctx.workspaceRegistry)
#
#   L8 — Multi-Agent:
#     dsh-subagent                  subagent registry: ctx.subagents, the
#                                   process-singleton seam ("Agent as a provider")
#     dsh-subagent-spawn-in-process provider "spawn": fresh child, no history
#     dsh-subagent-fork-in-process  provider "fork":  child seeded with the
#                                   parent's completed turns
#     dsh-tool-subagent             model-facing delegation tool; mounted twice
#                                   (subagent → spawn, subagent_fork → fork)
#     dsh-jobs                      ABSTRACT background-job registry seam —
#                                   its constructor throws by design when
#                                   mounted directly, so it is listed disabled
#     dsh-jobs-local                process-local ctx.jobs implementation
#     dsh-tool-jobs                 model-facing job control (job_list /
#                                   job_output / job_kill + completion notices)
#
# Architecture concept: Agent as a provider.  The subagent seam is a registry
# of named providers; spawn/fork decide HOW the child runs, the delegation
# tool decides THAT the model can ask for one.  Changing the provider changes
# transport without changing the execution contract.  Both in-process
# providers share @deepseek-ai/dsh-subagent-in-process-driver — a plain
# library (no plugin exports), so there is nothing to mount for it.
#
# Observable behavior (with --trace): a subagent delegation appears as
# tool/call (subagent) → the child's own session events (turn/start …) →
# tool/result carrying only the child's final message back to the parent.
# The child's intermediate steps never enter the parent's history.
#
# The persona is frozen (byte-for-byte identical to L4/L5/L6) so the
# progression remains a true single-variable experiment.
#
# Second L8 closure — subagent control plane:
#   dsh-tool-subagent-control            global send_message / interrupt_agent
#   dsh-tool-subagent-control/list-agents  schema registers now, calls go live
#                                          when session-projection arrives (L10)
#   dsh-tool-subagent-report             child-scoped `report` over continuations
# The control plane is wired but inert until a subagent instance sets
# backgroundMode: continuable — one-shot children accept no follow-ups.

- name: '@deepseek-ai/dsh-llm'
- name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      local-anthropic:
        displayName: Local Gateway
        api: anthropic-messages
        baseURL: !!js process.env.QA_BASE_URL ?? 'https://your-gateway.example'
        apiKeyEnv: QA_API_KEY
        models:
          - id: deepseek-v4-pro
            contextWindow: 1000000
          - id: deepseek-v4-flash
            contextWindow: 1000000
# ── Agent spine (inherited from L1) ───────────────────────────────────────────
- name: '@deepseek-ai/dsh-session'
- name: '@deepseek-ai/dsh-system-prompt'
  config:
    # FROZEN — do not change in L4/L5/L6 (A/B single-variable requirement)
    persona: You are a coding agent. Read files, run commands, fix bugs. Be concise.
- name: '@deepseek-ai/dsh-tools'
- name: '@deepseek-ai/dsh-agent'
- name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []
# ── persistence (inherited from L2) ───────────────────────────────────────────
- name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: ./sessions
- name: '@deepseek-ai/dsh-session-checkpoint-policy'
# ── FS capability seam (inherited from L3) ────────────────────────────────────
- name: '@deepseek-ai/dsh-fs-observation-policy'
- name: '@deepseek-ai/dsh-tool-fs'
# ── Shell capability seam (inherited from L4) ─────────────────────────────────
- name: '@deepseek-ai/dsh-subprocess-local'
- name: '@deepseek-ai/dsh-shell-env'
# ── FS search tools (new in L4 — depends on ctx.subprocess) ──────────
- name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'
# ── FS search tools (inherited from L4) ───────────────────────────────────────
- name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    # required key since 0.1.0-rc.6: sample over-cap glob results across
    # top-level dirs instead of truncating (irrelevant for the tiny fixture)
    sampleOverCapGlobResults: true
# ── sandbox layer (inherited from L5) ─────────────────────────────────────────
- name: '@deepseek-ai/dsh-sandbox-local'
- name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.QA_WORKSPACE ?? process.cwd()
# ── sandboxed FS (replaces dsh-fs-local from L3/L4) ───────────────────
- name: '@deepseek-ai/dsh-fs-sandbox'
- name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: !!js process.platform === 'win32'
  config:
    timeoutMs: 60000
# ── approval + permission presets (inherited from L6) ─────────────────────────
- name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: ask
# ── sandboxed FS (inherited from L5) ─────────────────────────────────
- name: '@deepseek-ai/dsh-permission-presets'
# ── stateful task seams (inherited from L7) ───────────────────────────────────
# ── stateful task seams (new in L7) ──────────────────────────────────
# todo_write: the model replaces the WHOLE list on every call; each call
# appends a todo/write event to the session log (last-write-wins on
# replay).  allowParallelInProgress is a required deployment choice — true
# permits several in_progress tasks at once, aligned with the other
# stages in this repo.
- name: '@deepseek-ai/dsh-user-questions'
- name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
# plan mode: durable plan/mode session state + the always-registered
# exit_plan_mode tool.  The /plan slash command stays dormant: it only
# registers when ctx.commands is composed (@deepseek-ai/dsh-commands is
# not mounted).  The exit review asks through ctx.userQuestions; with no
# UI provider installed the review fails with a clear NO_PROVIDER error
# and the session stays in plan mode.  Plan mode is soft guidance —
# sandbox mode and approval policy enforce restrictions independently
# and never read plan state.
- name: '@deepseek-ai/dsh-plan-mode'
  config:
    # Required, non-empty (unknown keys fail at load): the guidance section
    # rendered at prompt order 50 while plan mode is active.
    section: |
      You are in plan mode. Explore and design before presenting the complete
      plan through exit_plan_mode.
- name: '@deepseek-ai/dsh-goal'
  config:
    defaultMaxGoalRounds: 256   # the schema default, written out for visibility
  # blockedAfterConsecutiveRounds defaults to 3; no override needed here.
- name: '@deepseek-ai/dsh-tool-goal'
- name: '@deepseek-ai/dsh-storage'
- name: '@deepseek-ai/dsh-storage-sqlite'
  config:
    # Backend registers on the hub under the fixed name "sqlite".  path is
    # required (':memory:' allowed); a file keeps workspace records durable
    # next to the session logs inside the disposable run root.
    path: ./storage/domain.db
    # journalMode defaults to 'wal'.
- name: '@deepseek-ai/dsh-storage-domain'
  config:
    backend: sqlite
- name: '@deepseek-ai/dsh-workspace'
# ── skills (inherited from L7) ────────────────────────────────────────────────
  # The skill seam itself: ctx.skills, a scope-layered registry of named
  # skill PROVIDERS — the same Definition → Provider → Consumer shape as
  # ctx.subagents.  It owns no skill source and renders no model-facing
  # surface: providers register catalogs, consumers read them.
  # No config (collectCacheMaxEntries defaults to 128).
- name: '@deepseek-ai/dsh-skill'
  # Provider "filesystem" (default providerName): scans the project roots
  # (.dsh/skills, .agents/skills at the nearest .git ancestor), then
  # customSkillDirs, then the user roots (~/.dsh/skills, ~/.agents/skills)
  # for <name>/SKILL.md bundles and flat <name>.md files.  The chokidar
  # watch (default on) invalidates the provider so the next pre-step
  # republishes a changed catalog.  inject [skills] — satisfied above;
  # all defaults kept.
- name: '@deepseek-ai/dsh-skill-filesystem'
  # Consumer: emits the durable <available_skills> catalog message before
  # the first request (append-only complete replacement when membership,
  # descriptions, or tool visibility change) and registers the `skill`
  # loader tool, whose result is the canonical <skill_content> block.
  # inject [agents, tools, skills] — all present in this graph.
  # No config (catalogDescriptionMaxLength defaults to 500).
- name: '@deepseek-ai/dsh-tool-skill'
  # DISABLED — optional bundled provider contributing the fixed `dsh-badge`
  # skill (official "powered by dsh" Markdown snippets plus the packaged
  # PNG as resource base).  The upstream CLI composition ships this row
  # disabled: true as an explicit opt-in, and the same choice is kept
  # here; enable it to see a guaranteed built-in skill enter the catalog.
- name: '@deepseek-ai/dsh-skill-badge'
  disabled: true
# ── task helpers (inherited from L7) ──────────────────────────────────────────
  # The runtime that makes goal mode autonomous: at whole-agent idle, an
  # active, armed goal with remaining capacity is continued as sequential
  # retained <goal_round> prompts, each admitted only after a
  # sessions.flush() durability checkpoint.  inject [agents, goals,
  # sessions] — goals comes from the stateful-task closure above.  No
  # config BY DESIGN: the round cap lives in the goal definition and the
  # blocked threshold in dsh-tool-goal, so the driver cannot diverge
  # from either.
- name: '@deepseek-ai/dsh-goal-round-driver'
  # AGENTS.md / CLAUDE.md loader (the roadmap's "reads AGENTS.md"): folds
  # the user-global ($DSH_HOME/AGENTS.md) plus project instruction chain
  # into durable history at the first pre-step, then discovers nested
  # files after successful read/write/edit tool calls — additions,
  # replacements, and removal notices.  Reads go through the optional
  # ctx.fs (no static inject, so providerless trees still boot); here
  # the L5 sandboxed fs serves them.  Defaults kept: candidates
  # AGENTS.md/CLAUDE.md + .local overlays, maxSourceBytes 1 MiB,
  # projectRootMarkers ['.git'].
- name: '@deepseek-ai/dsh-agent-instructions'
  config:
    # REQUIRED, no schema default: per-session render budget for the whole
    # injected instruction chain — each deployment must make this
    # prompt-budget choice explicitly.  Broader files are dropped whole
    # before the most-specific file is truncated.
    maxBytes: 32768
  # Durable reminders hung on the session event log: schedule_create /
  # schedule_list / schedule_delete tools, installed on root agents
  # created after this plugin loads.  schedule/change events are the only
  # authority — timers, tool values, and due-reminder follow-ups are
  # disposable projections, so replay reconstructs every reminder.
  # inject [agents, sessions, tools, sessionPersistence] — persistence
  # comes from the L2 JSONL backend, and the static inject makes a
  # missing persistence service a composition error.  No config.
- name: '@deepseek-ai/dsh-schedule'
  # Model-facing surgical editor: str_replace_editor (view / create /
  # str_replace / insert) over ctx.fs — one unique literal match
  # required, no regex, no replace_all.  inject [tools, fs]: fs is the
  # sandboxed provider from L5, and every mutation routes through
  # fs/write-intent / fs/edit-intent, so the sandbox policy and the L6
  # approval gate apply unchanged.  Defaults kept (maxOutputChars
  # 16000, package tool description).
- name: '@deepseek-ai/dsh-tool-str-replace-editor'
# ── multi-agent (new in L8) ───────────────────────────────────────────────────
  # The seam itself: registers ctx.subagents, the process-singleton registry
  # of named subagent providers, plus the delegation-depth vocabulary and the
  # subagent/start ↔ subagent/end lifecycle events.
- name: '@deepseek-ai/dsh-subagent'
  # Provider "spawn" (default providerName): fresh child Agent in this
  # process — own session, inherits cwd/model, sees NO parent history.
- name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  # Provider "fork" (default providerName): same in-process run mechanics as
  # spawn, but the child's session is seeded with the parent's completed
  # turns (the contiguous prefix ending at the last turn/end).
- name: '@deepseek-ai/dsh-subagent-fork-in-process'
- name: '@deepseek-ai/dsh-tool-subagent'
  config:
    # First instance → the `subagent` tool over the spawn provider.
    # Defaults kept: backgroundMode one-shot (foreground unless the model
    # passes run_in_background), maxDepth 3, background calls enabled.
    # The tool registers only while its provider exists — with spawn mounted
    # above, the `subagent` schema appears in the parent's tool registry.
    provider: spawn
- name: '@deepseek-ai/dsh-tool-subagent'
  config:
    # Second instance → the `subagent_fork` tool over the fork provider.
    # One plugin instance binds exactly one provider to one tool name, so
    # exposing both transports requires two distinctly named instances.
    provider: fork
    toolName: subagent_fork
  # dsh-jobs is the ABSTRACT job-registry contract: mounting it directly
  # throws by design ("load an implementation such as dsh-jobs-local
  # instead").  It is listed here, disabled, so the closure stays visible
  # in inspect/diff; the concrete registry below provides ctx.jobs.
- name: '@deepseek-ai/dsh-jobs'
  disabled: true
  # Process-local JobRegistry (default maxConcurrentJobsPerOwner: 10).
- name: '@deepseek-ai/dsh-jobs-local'
  # Model-facing job control: job_list / job_output / job_kill plus
  # completion notices; also attaches the per-owner job controller that
  # ctx.jobs.start() requires, which is what makes one-shot BACKGROUND
  # subagent delegation (run_in_background: true) collectable.
  # Config defaults kept: waitTimeoutMs 30s, maxWaitTimeoutMs 600s,
  # completionDelivery 'wakeup', maxConsecutiveWakes 3.
- name: '@deepseek-ai/dsh-tool-jobs'
# ── subagent control (new in L8) ──────────────────────────────────────────────
  # ── subagent control plane (new in L8) ────────────────────────────
  # The parent-to-child direction, registered ONCE and globally named:
  # send_message (deliver a follow-up as the child's next FIFO turn) and
  # interrupt_agent (cancel only the target's current turn; queued
  # messages park, descendants keep running).  Keeping the controls in
  # one separately loaded plugin is what lets several provider-bound
  # delegation tools (subagent, subagent_fork above) share one control
  # API without double-registering it.  No config.  inject = [tools,
  # subagents]; the continuation runtime itself comes from ctx.agents
  # (dsh-agent, L1), so followup/interrupt are live at this level.
  # NOTE: both mounted delegation instances keep backgroundMode
  # 'one-shot', so no continuable child can be started yet — the
  # controls are wired but have nothing to steer until a
  # dsh-tool-subagent instance sets backgroundMode: continuable.
- name: '@deepseek-ai/dsh-tool-subagent-control'
  # list_agents rides a separate subpath export (inject [tools,
  # subagents, agents]) so a deployment can deliver continuation
  # without exposing discovery.  Its schema registers here, but
  # every CALL also reads the sessionProjections registry — absent
  # until dsh-session-projection (L10) — and fails cleanly with
  # SUBAGENT_CONTROL_PROJECTIONS_UNAVAILABLE.  Mounting it now keeps
  # the whole closure visible; it goes fully live at L10.
- name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
  # The child-to-parent direction: NOT a global tool but a
  # continuable-child setup contribution, so `report` and its
  # tool:report prompt section exist only inside continuable
  # in-process children — roots, one-shot children, and the parent
  # never see them, and the registration survives the child's
  # toolFilter so a delegation allow-list cannot strip the only
  # return channel.  inject = [subagents, tools, systemPrompt], all
  # satisfied in this graph.
- name: '@deepseek-ai/dsh-tool-subagent-report'
  config:
    # Deployment scheduling policy for accepted reports (the schema
    # default, written out for visibility): next-step delivers through
    # parent.steer() — a running parent receives the report at its nearest
    # step boundary, an idle parent starts a turn.  The alternative 'quiet'
    # uses parent.inject() and never wakes a parked parent.  The
    # model-facing schema cannot override this per call.
    reportDelivery: next-step
- name: ./driver.mjs
