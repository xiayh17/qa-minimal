# Stage 05 — Safe Agent: capability ⊥ permission
#
# Same Agent + FS + Shell as Stage 04, but now sandboxed.
# The model, the tools, the question are identical — what changes is the
# safety layer wrapping the SAME capabilities:
#
#   dsh-sandbox-local       the sandbox boundary
#   dsh-sandbox-policy      mode: workspace-write (writes confined to cwd)
#   dsh-user-approval       auto-allow (headless: no terminal to ask)
#   dsh-permission-presets  ties sandbox + approval together
#
# FS and bash providers switch from *-local to *-sandbox:
#   dsh-fs-sandbox   wraps dsh-fs-local with sandbox enforcement
#   dsh-bash-sandbox wraps dsh-bash-local with sandbox enforcement
#
# The teaching point: "can execute" and "is allowed to execute" are two
# independent plugin layers. Stage 04 could but wasn't allowed; Stage 05
# can but ISN'T allowed (outside the workspace).
- name: '@deepseek-ai/dsh-llm'
- name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      local-anthropic:
        displayName: Local Gateway
        api: anthropic-messages
        baseURL: !!js process.env.QA_BASE_URL ?? 'https://your-gateway.example'
        apiKeyEnv: QA_API_KEY
        models:
          - id: deepseek-v4-pro
            contextWindow: 1000000
          - id: deepseek-v4-flash
            contextWindow: 1000000
- name: '@deepseek-ai/dsh-session'
- name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: You are a coding agent. Read files, run commands, fix bugs. Be concise.
- name: '@deepseek-ai/dsh-tools'
- name: '@deepseek-ai/dsh-agent'
- name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []
# ── safety layer (new in L5) ──────────────────────────────────────────
- name: '@deepseek-ai/dsh-sandbox-local'
- name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()
- name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: never
# ── sandboxed FS (replaces dsh-fs-local from L3/L4) ───────────────────
- name: '@deepseek-ai/dsh-fs-sandbox'
- name: '@deepseek-ai/dsh-fs-observation-policy'
- name: '@deepseek-ai/dsh-tool-fs'
# ── sandboxed shell (replaces dsh-bash-local from L4) ────────────────
- name: '@deepseek-ai/dsh-subprocess-local'
- name: '@deepseek-ai/dsh-shell-env'
- name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: !!js process.platform === 'win32'
  config:
    timeoutMs: 60000
- name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'
- name: ./driver.mjs