# Stage 05 — Sandboxed Agent: capability ⊥ permission
#
# L5 = L4 + Sandbox.  Every plugin from Stage 04 is still here — FS tools,
# shell, search, persistence, resume — but now the FS and bash providers
# switch from *-local to *-sandbox variants, wrapped by a sandbox layer.
#
#   dsh-sandbox-local       the sandbox boundary
#   dsh-sandbox-policy      mode: workspace-write (writes confined to workspace)
#   dsh-fs-sandbox          wraps dsh-fs-local with sandbox enforcement
#   dsh-bash-sandbox        wraps dsh-bash-local with sandbox enforcement
#
# This stage demonstrates SANDBOX ENFORCEMENT only.  Approval and permission
# presets are a separate capability closure — they arrive in Stage 06.
#
# The persona is frozen (byte-for-byte identical to L4) so the L4→L5 A/B
# experiment is truly single-variable: only the safety layer changes.
- name: '@deepseek-ai/dsh-llm'
- name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      local-anthropic:
        displayName: Local Gateway
        api: anthropic-messages
        baseURL: !!js process.env.QA_BASE_URL ?? 'https://your-gateway.example'
        apiKeyEnv: QA_API_KEY
        models:
          - id: deepseek-v4-pro
            contextWindow: 1000000
          - id: deepseek-v4-flash
            contextWindow: 1000000
- name: '@deepseek-ai/dsh-session'
- name: '@deepseek-ai/dsh-system-prompt'
  config:
    # FROZEN — byte-for-byte identical to L4 (A/B single-variable requirement)
    persona: You are a coding agent. Read files, run commands, fix bugs. Be concise.
- name: '@deepseek-ai/dsh-tools'
- name: '@deepseek-ai/dsh-agent'
- name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []
# ── persistence (inherited from L2) ──────────────────────────────────
- name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: ./sessions
- name: '@deepseek-ai/dsh-session-checkpoint-policy'
# ── sandbox layer (new in L5) ────────────────────────────────────────
- name: '@deepseek-ai/dsh-sandbox-local'
- name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.QA_WORKSPACE ?? process.cwd()
# ── sandboxed FS (replaces dsh-fs-local from L3/L4) ───────────────────
- name: '@deepseek-ai/dsh-fs-sandbox'
- name: '@deepseek-ai/dsh-fs-observation-policy'
- name: '@deepseek-ai/dsh-tool-fs'
# ── sandboxed shell (replaces dsh-bash-local from L4) ────────────────
- name: '@deepseek-ai/dsh-subprocess-local'
- name: '@deepseek-ai/dsh-shell-env'
- name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: !!js process.platform === 'win32'
  config:
    timeoutMs: 60000
- name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'
# ── FS search tools (inherited from L4) ──────────────────────────────
- name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    # required key since 0.1.0-rc.6 (see Stage 04)
    sampleOverCapGlobResults: true
- name: ./driver.mjs