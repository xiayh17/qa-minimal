# Stage 10 — Operable Harness
#
# L10 = L9 + Operability.  Every plugin from Stage 09 is still here —
# the sandboxed, approval-gated, persistent agent with the L7 stateful-task
# closure (todo / plan-mode / goal / workspace), the L8 multi-agent closure
# (subagent registry + providers + jobs), and the L9 long-task runtime
# (workflow engine / ralph / token-meter / compaction) — plus the L10
# operability closure:
#
#   dsh-llm-retry          transient provider failures heal themselves:
#                          hooks the loop's agent/request-error waterfall,
#                          backs off (500ms→10s + jitter, 2 retries in the
#                          default "normal" mode) and appends durable
#                          llm/retry + llm/retry-started session events.
#                          No config of its own — per-provider policy lives
#                          in the adapter's optional `retryPolicy` key;
#                          omission = normal mode, so mounting alone turns
#                          retry on.
#   dsh-invariants         ctx.invariants registry: runtime assertions over
#                          the durable session log.  The registry alone
#                          installs no checks — each package may publish a
#                          `<pkg>/invariant` companion (inject:
#                          ["invariants"]) that registers its own checks.
#   dsh-session-telemetry  telemetry seam — still DISABLED, see below.
#   dsh-session-projection ctx.sessionProjections registry — mounted here,
#                          in L10, because its first consumer in this
#                          composition is session-stats.
#   dsh-session-stats      registers the `sessionStats` projection unit
#                          (turn/step counts, llm/tool/ttft/decode wall
#                          times).  ACTIVE at this level: its
#                          `sessionProjections` inject is now satisfied by
#                          dsh-session-projection above.
#
# The architectural concept: "runs" ≠ "operable".
#   retry      → transient faults self-heal       (the run survives)
#   telemetry  → session records can be exported   (the run is observable)
#   stats      → whole-session figures are folded  (the run is measurable)
#   invariants → runtime assertions over the log   (the run is audited)
#
# What --trace shows at this level that L9 did not: on a flaky gateway the
# trace gains `llm/retry` / `llm/retry-started` events around the same
# turn/step machinery (the smoke run's dead baseURL classifies as
# TRANSPORT, so retry fires twice before the error surfaces), and the
# session-projection registry now folds live `sessionStats` figures as
# those events stream by.
#
# Remaining gaps in the pinned 0.1.0-rc.6 dependency set (entries kept
# visible in inspect/diff, mounted `disabled`):
#   - dsh-session-telemetry is a pure Service Definition: its module
#     exports only the abstract SessionTelemetryBackend + coordinator and
#     NO plugin entry, so cordis rejects it as "invalid plugin".  A
#     backend implementation (e.g. an OTel package) is not installed.
#   - dsh-jobs, dsh-compaction and dsh-workflow are abstract Service
#     Definitions.  dsh-jobs throws by design when mounted directly;
#     dsh-compaction / dsh-workflow would double-register ctx.compaction /
#     ctx.workflowEngine next to their concrete providers
#     (dsh-compaction-basic, dsh-workflow-worker-thread).  Exactly one
#     implementation per context — the providers carry the runtime.
#
# The persona is frozen (byte-for-byte identical to L4/L5/L6) so the
# whole L4→L10 progression remains a single-variable experiment.
- name: '@deepseek-ai/dsh-llm'
- name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      local-anthropic:
        displayName: Local Gateway
        api: anthropic-messages
        baseURL: !!js process.env.QA_BASE_URL ?? 'https://your-gateway.example'
        apiKeyEnv: QA_API_KEY
        models:
          - id: deepseek-v4-pro
            contextWindow: 1000000
          - id: deepseek-v4-flash
            contextWindow: 1000000
- name: '@deepseek-ai/dsh-session'
- name: '@deepseek-ai/dsh-system-prompt'
  config:
    # FROZEN — byte-for-byte identical to L4/L5 (A/B single-variable requirement)
    persona: You are a coding agent. Read files, run commands, fix bugs. Be concise.
- name: '@deepseek-ai/dsh-tools'
- name: '@deepseek-ai/dsh-agent'
- name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []
# ── persistence (inherited from L2) ──────────────────────────────────
- name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: ./sessions
- name: '@deepseek-ai/dsh-session-checkpoint-policy'
# ── sandbox layer (inherited from L5) ────────────────────────────────
- name: '@deepseek-ai/dsh-sandbox-local'
- name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.QA_WORKSPACE ?? process.cwd()
# ── approval + permission presets (inherited from L6) ────────────────
- name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: ask
- name: '@deepseek-ai/dsh-permission-presets'
# ── sandboxed FS (inherited from L5) ─────────────────────────────────
- name: '@deepseek-ai/dsh-fs-sandbox'
- name: '@deepseek-ai/dsh-fs-observation-policy'
- name: '@deepseek-ai/dsh-tool-fs'
# ── sandboxed shell (inherited from L5) ──────────────────────────────
- name: '@deepseek-ai/dsh-subprocess-local'
- name: '@deepseek-ai/dsh-shell-env'
- name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: !!js process.platform === 'win32'
  config:
    timeoutMs: 60000
- name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'
# ── FS search tools (inherited from L4) ──────────────────────────────
- name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    # Required boolean in the pinned rc.6 schema (no default) — the one
    # place this file cannot stay byte-identical to Stage 06: the frozen
    # L6 entry predates the key and no longer passes validation.  `true`
    # samples an over-cap glob result across top-level entries (spans the
    # tree) instead of returning the modification-time-ordered head.
    sampleOverCapGlobResults: true
# ── stateful task agent (inherited from L7) ──────────────────────────
- name: '@deepseek-ai/dsh-tool-todo'
  config:
    # Required boolean (no default in the schema).  `true` allows several
    # todos `in_progress` at once — honest now that L8 subagents and
    # background jobs make genuinely parallel work possible.
    allowParallelInProgress: true
# ctx.userQuestions service: the question-asking seam plan-mode's
# exit_plan_mode review reads through ctx.get("userQuestions").  Mounted
# so the review path is live instead of resolving "unavailable".
- name: '@deepseek-ai/dsh-user-questions'
# ENABLED (gap closed): dsh-user-questions is now installed, so the
# static import resolves.  `section` is REQUIRED (non-empty): the
# deployment-owned guidance shown in each request while plan mode is
# active; /plan and /plan off are available when a commands service is
# composed (not mounted here — plan state is still reachable through
# exit_plan_mode and the plan/mode log events).
- name: '@deepseek-ai/dsh-plan-mode'
  config:
    section: Plan mode is active. Do not make changes yet — explore, then present a complete plan via exit_plan_mode.
- name: '@deepseek-ai/dsh-goal'
  config:
    # Schema default made explicit: a goal may drive at most this many
    # autonomous continuation rounds before it must complete or block.
    defaultMaxGoalRounds: 256
- name: '@deepseek-ai/dsh-tool-goal'
  config:
    # Schema default made explicit: after this many consecutive autonomous
    # rounds without progress the goal is marked blocked instead of looping.
    blockedAfterConsecutiveRounds: 3
# Storage chain for the workspace registry (Definition → backend → domain
# form): the hub (ctx.storage), one named backend ("sqlite"), and the
# domain data form which provides the `storageDomain` service that
# dsh-workspace injects.
- name: '@deepseek-ai/dsh-storage'
- name: '@deepseek-ai/dsh-storage-sqlite'
  config:
    # Required string.  Lives inside the disposable tmp workspace next to
    # ./sessions; missing directories are created owner-only by the plugin.
    path: ./storage/domain.db
- name: '@deepseek-ai/dsh-storage-domain'
  config:
    # Required string: default backend route, registered by the sqlite
    # plugin above.  `routes` (per-domain overrides) defaults to {}.
    backend: sqlite
# ENABLED (gap closed): dsh-storage-domain is now installed and mounted
# above, so both required injects (storageDomain, sessionPersistence)
# resolve and the workspace registry boots.
- name: '@deepseek-ai/dsh-workspace'
# ── multi-agent (inherited from L8) ──────────────────────────────────
- name: '@deepseek-ai/dsh-subagent'
# ENABLED (gap closed): @deepseek-ai/dsh-subagent-in-process-driver is now
# installed — it is a pure library (exports startInProcessRun, no plugin
# entry), so nothing is mounted for it; it simply makes these two
# providers importable again.
- name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  # No config: providerName defaults to "spawn" — a fresh child with no
  # parent history (inheritsParentContext = false), structured output
  # supported.  This is the provider `subagent` and `ralph` route to below.
- name: '@deepseek-ai/dsh-subagent-fork-in-process'
  # No config: providerName defaults to "fork" — the child inherits the
  # parent's session history up to the fork point.
- name: '@deepseek-ai/dsh-tool-subagent'
  config:
    # Required string: which registered subagent provider the `subagent`
    # tool routes to — now a live provider, so the tool registers.
    # Children inherit the parent's provider/model unless agentOptions
    # overrides them (left unset — same routed model).
    provider: spawn
- name: '@deepseek-ai/dsh-tool-subagent'
  config:
    # Second instance → the `subagent_fork` tool over the fork provider.
    # One plugin instance binds exactly one provider to one tool name, so
    # exposing both transports requires two distinctly named instances.
    provider: fork
    toolName: subagent_fork
# DISABLED — abstract seam: dsh-jobs is the Service Definition for
# ctx.jobs; its constructor throws by design ("load an implementation such
# as dsh-jobs-local instead").  The closure is listed here, the runtime
# comes from dsh-jobs-local below.
- name: '@deepseek-ai/dsh-jobs'
  disabled: true
- name: '@deepseek-ai/dsh-jobs-local'
  # No config: maxConcurrentJobsPerOwner defaults to 10.  Mounting the
  # registry is what turns the subagent tool's background mode on
  # (ctx.get("jobs") resolves instead of throwing).
# Model-facing job controls (job_output / job_kill / job_wait over
# ctx.jobs).  All config keys have defaults (waitTimeoutMs 30s,
# completionDelivery "wakeup") — mounted with no config.
- name: '@deepseek-ai/dsh-tool-jobs'
# ── workflow / long-task runtime (inherited from L9) ─────────────────
# DISABLED — abstract seam: dsh-workflow is the Service Definition for
# ctx.workflowEngine.  A concrete engine is now mounted below, and
# co-mounting both double-registers the service and crashes — exactly one
# implementation per context.  Listed for closure visibility.
- name: '@deepseek-ai/dsh-workflow'
  disabled: true
# The concrete workflow engine: runs each model-written script in a fresh
# worker thread.  Injects ["subagents"] (mounted above); all config keys
# have defaults — provider "spawn" matches the enabled spawn provider,
# maxTotalAgents 1000 is the deployment ceiling ralph rounds coordinate
# against.
- name: '@deepseek-ai/dsh-workflow-worker-thread'
- name: '@deepseek-ai/dsh-tool-ralph'
  config:
    # Must name a FRESH provider (inheritsParentContext = false) with
    # structured-output support — "spawn" qualifies, "fork" is rejected
    # by requireFreshProvider at execution time.
    subagentProvider: spawn
    # Deployment ceiling for ralph rounds (schema default 256); one fresh
    # child agent is started per round, carrying only the immutable
    # objective plus the previous bounded handoff.
    maxRounds: 256
- name: '@deepseek-ai/dsh-token-meter'
  # No config — the schema is empty and rejects every key ("no settings
  # are supported").  The meter folds token usage from the session log and
  # answers context-pressure queries for the compaction engine.
# DISABLED — abstract seam: dsh-compaction is the Service Definition for
# ctx.compaction.  Unlike dsh-jobs its constructor does not guard, but
# mounting it alongside dsh-compaction-basic fails with duplicate service
# "compaction" — exactly one implementation per context.  Listed for
# closure visibility; the engine below carries the runtime.
- name: '@deepseek-ai/dsh-compaction'
  disabled: true
- name: '@deepseek-ai/dsh-compaction-basic'
  config:
    # All values below are the schema defaults, made explicit for reading.
    # Compact when measured pressure reaches 80% of the routed model's
    # contextWindow (see dsh-llm-pi-ai above: 1,000,000 tokens)...
    thresholdRatio: 0.8
    # ...and keep the most recent ~16% of the window verbatim; everything
    # older is folded into one summary node.
    retainRatio: 0.16
    # auto = between-step pressure checks + request-overflow recovery.
    # summarizationProvider/summarizationModel stay unset (empty pair =
    # reuse the compacted agent's own routed provider/model).
    auto: true
- name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
  # No config: deterministic pruning defaults — tool results over
  # thresholdChars 8192 are replaced by head 4096 + marker + tail 1024.
# ── operability (new in L10) ─────────────────────────────────────────
- name: '@deepseek-ai/dsh-llm-retry'
  # No config — the executor's schema is empty; policy lives in each
  # provider profile's optional `retryPolicy` key (omitted above =
  # "normal" mode: 2 retries on EMPTY_RESPONSE/RATE_LIMIT/SERVER/TIMEOUT/
  # TRANSPORT, bounded 500ms→10s backoff + 10% jitter).  Hooks the loop's
  # agent/request-error waterfall and appends durable llm/retry +
  # llm/retry-started events — watch for them in --trace.
- name: '@deepseek-ai/dsh-invariants'
  # No config — defaults: enabled: true, empty allow/blocklists (every
  # companion selected).  The registry alone installs NO checks; concrete
  # runtime assertions come from per-package companions mountable as
  # '@deepseek-ai/<pkg>/invariant' (not added here — the declared L10
  # closure is the registry seam itself).
- name: '@deepseek-ai/dsh-session-telemetry'
  # DISABLED — still not a mountable plugin: the module exports only the
  # abstract SessionTelemetryBackend class + SessionTelemetryCoordinator
  # (no apply, no default plugin), so cordis rejects it as
  # "invalid plugin".  The seam needs a backend implementation (e.g. an
  # OTel package) that is not installed.  Entry kept for closure
  # visibility in inspect/diff.
  disabled: true
# Session projection registry (ctx.sessionProjections): folds per-session
# projection units from the durable log and serves them to consumers.
# Mounted in L10 because its first consumer in this composition is
# session-stats below; several earlier plugins (todo, plan-mode,
# token-meter, subagent) also register their units here now that the
# registry exists.
- name: '@deepseek-ai/dsh-session-projection'
# ACTIVE at this level: the `sessionProjections` inject is satisfied
# above, so the `sessionStats` unit (turns, steps, llmMs, ttftMs,
# decodeMs, toolMs folded from the whole log) actually registers and
# folds live.  No config.
- name: '@deepseek-ai/dsh-session-stats'
- name: ./driver.mjs
