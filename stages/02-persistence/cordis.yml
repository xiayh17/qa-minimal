# Stage 02 — Persistent Agent: memory survives process exit
#
# Same Agent spine as Stage 01, plus two persistence plugins:
#   session-persistence-jsonl  writes the event log to ./sessions/<id>.jsonl
#   session-checkpoint-policy checkpoints before each model request
#
# The agent-loop itself is unchanged. Memory is NOT inside the loop —
# it's a separate capability seam (session persistence) that the loop
# happens to write to. Swap JSONL for SQLite and the loop never notices.
#
# This is the foundation for all later stages: L3–L6 inherit these two
# plugins so the agent can always resume across process restarts.

- name: '@deepseek-ai/dsh-llm'
- name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      local-anthropic:
        displayName: Local Gateway
        api: anthropic-messages
        baseURL: !!js process.env.QA_BASE_URL ?? 'https://your-gateway.example'
        apiKeyEnv: QA_API_KEY
        models:
          - id: deepseek-v4-pro
            contextWindow: 1000000
          - id: deepseek-v4-flash
            contextWindow: 1000000
# ── Agent spine (inherited from L1) ───────────────────────────────────────────
- name: '@deepseek-ai/dsh-session'
- name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: You are a helpful assistant. Answer concisely.
- name: '@deepseek-ai/dsh-tools'
- name: '@deepseek-ai/dsh-agent'
- name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []
# ── persistence (new in L2) ───────────────────────────────────────────────────
- name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: ./sessions
- name: '@deepseek-ai/dsh-session-checkpoint-policy'
- name: ./driver.mjs
